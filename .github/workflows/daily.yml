name: daily-issue

on:
  schedule:
    # The real 9 PM start comes from an outside timer (cron-job.org -> workflow_dispatch with nightly=true),
    # because GitHub starts its own scheduled runs hours late. These two stay as backups; a run that finds
    # tonight's stories already written stops at once.
    - cron: "30 15 * * *"      # 21:00 IST: the day's stories (also schedules the next morning's 10:00 reminder)
    - cron: "47 16 * * *"      # 22:17 IST: backup, in case GitHub skips the 21:00 run
  workflow_dispatch:             # "Run workflow" button: build an issue now
    inputs:
      nightly:                   # set by the outside 9 PM timer (cron-job.org), which starts on time
        description: "The nightly 9 PM run (skips if tonight's stories are already written)"
        type: boolean
        default: false
  push:
    branches: [main]             # code change: just redeploy the site

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt }
      - name: Write today's issue
        if: github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          SCHEDULED: ${{ github.event_name == 'schedule' || inputs.nightly == true }}
        run: |
          pip install -r requirements.txt
          python pipeline/build.py --site site
      - name: Still remind at 10:00 tomorrow if writing failed
        if: failure() && (github.event_name == 'schedule' || inputs.nightly == true)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: pip install -q requests feedparser trafilatura && python pipeline/build.py --remind-only
      - name: Keep the issue in the repo (archive)
        if: github.event_name != 'push'
        run: |
          git config user.name "read-xp bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/issues
          git diff --cached --quiet || (git commit -q -m "issue $(TZ=Asia/Kolkata date +%F)" && git push -q)
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
