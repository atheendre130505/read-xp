name: daily-issue

on:
  schedule:
    - cron: "30 3 * * *"       # 09:00 IST: morning edition (also schedules the 10:00 reminder)
    - cron: "30 15 * * *"      # 21:00 IST: evening edition
  workflow_dispatch: {}          # "Run workflow" button: build an issue now
  push:
    branches: [main]             # code change: just redeploy the site

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.txt }
      - name: Write today's issue
        if: github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          pip install -r requirements.txt
          python pipeline/build.py --site site
      - name: Still remind at 10:00 if writing failed
        if: failure() && github.event_name == 'schedule' && github.event.schedule == '30 3 * * *'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: pip install -q requests feedparser trafilatura && python pipeline/build.py --remind-only
      - name: Keep the issue in the repo (archive)
        if: github.event_name != 'push'
        run: |
          git config user.name "read-xp bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/issues
          git diff --cached --quiet || (git commit -q -m "issue $(TZ=Asia/Kolkata date +%F)" && git push -q)
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
