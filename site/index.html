<!-- reading ruler: a clear band at eye height, the rest of the page gently dimmed -->
<div id="ruler" aria-hidden="true"><div class="shade top"></div><div class="band"></div><div class="shade bot"></div></div>

<!-- appears under selected text -->
<button id="askpill" hidden><svg viewBox="0 0 20 20" width="16" height="16"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h7A2.5 2.5 0 0 1 16 5.5v5a2.5 2.5 0 0 1-2.5 2.5H9l-3.5 3v-3A1.5 1.5 0 0 1 4 11.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>Ask about this</button>

<div id="toast"></div>
